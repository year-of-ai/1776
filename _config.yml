# GitHub Pages configuration — year-of-ai/1776
# A thin remote_theme consumer: this repo holds only content; the shared
# zer0-mistakes theme is pulled in at build time (no theme files vendored).
# The seed + growth orchestration live in the hub (year-of-ai/year-of-ai.github.io).
site_configured: true
title: "The Year 1776"
description: "A self-growing knowledge base about the year 1776. Next era of the year-of-ai lineage, spawned from 2005-2011."
github_user: "year-of-ai"
repository_name: "1776"
repository: "year-of-ai/1776"
url: "https://year-of-ai.github.io"
baseurl: "/1776"
remote_theme: "bamr87/zer0-mistakes"
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
teaser: /images/previews/default.svg
og_image: /images/previews/default.svg

# Masthead brand mark. Unset, the theme's header renders
# <img src="{{ site.logo | relative_url }}"> with an empty path, which resolves
# to the baseurl itself ("/1776") and shows a broken image on every page.
logo: /assets/images/favicon.svg

# Browser identity. The theme's _includes/core/favicon.html always emits the
# `ico` link and assumes the consuming site carries a favicon at its root —
# jekyll-remote-theme copies only _layouts/_includes/_sass/assets, so the
# theme's own root favicon.ico never reaches a member and /1776/favicon.ico
# 404'd. Both files are minted by the hub's scripts/generate-favicon.rb.
favicon:
  ico: /favicon.ico
  svg: /assets/images/favicon.svg

# README.md becomes the site homepage via jekyll-readme-index.
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
optional_front_matter:
  remove_originals: true
relative_links:
  enabled: true
titles_from_headings:
  enabled: true
  strip_title: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      # The theme's article layout renders the top-of-page hero from
      # `page.preview` only for featured/breaking posts unless a post opts in
      # (_layouts/article.html, issue #303). Every article here carries a
      # preview, so opt the whole collection in — the layout still guards on
      # `page.preview`, so a post without one simply renders no hero.
      show_hero: true
      author_profile: false
      read_time: true
      share: true
      comments: false
      related: true
  - scope:
      path: ""
    values:
      layout: default
      hide_intro: true
      author_profile: false
      read_time: true
      share: true
# Kept in the repo but NOT published as site pages.
exclude:
  - CLAUDE.md
  - .claude/
  - telemetry/
